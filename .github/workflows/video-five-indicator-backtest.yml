name: YouTube five-indicator 3-month backtest
on:
  push:
    branches: [video-five-indicators-2026]
    paths:
      - 'agent/experiments/video_five_indicators/**'
      - 'agent/tests/test_video_five_indicators.py'
      - '.github/workflows/video-five-indicator-backtest.yml'
  workflow_dispatch:
jobs:
  historical-backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install runtime and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Offline strategy tests
        run: PYTHONPATH=agent python -m pytest agent/tests/test_video_five_indicators.py -q
      - name: Official Binance Vision historical data and Vibe run
        working-directory: agent
        run: python -m experiments.video_five_indicators.run --timeframe 1H --output video-five-backtest-results
      - name: Upload provenance, Vibe runs and stats
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video-five-indicators-2026-1H
          path: agent/video-five-backtest-results/
          if-no-files-found: warn
